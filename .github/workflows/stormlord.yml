name: Stormlord CI e publicação

on:
  workflow_call:
    inputs:
      sistema:
        description: Identificador do sistema
        required: true
        type: string
      publicar:
        description: Publicar depois do teste
        default: false
        type: boolean
      ref:
        description: Branch, tag ou versão exata
        default: ""
        type: string
    secrets:
      STORMLORD_DEPLOY_HOST:
        required: false
      STORMLORD_DEPLOY_KEY:
        required: false
      STORMLORD_VPS1_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

concurrency:
  group: stormlord-${{ inputs.sistema }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar a versão solicitada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Validar identificador e testar
        env:
          SISTEMA: ${{ inputs.sistema }}
        run: |
          [[ "$SISTEMA" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          docker build --target ci --file Dockerfile .

      - name: Preparar acesso restrito
        if: inputs.publicar
        env:
          CHAVE: ${{ secrets.STORMLORD_DEPLOY_KEY }}
          CONHECIDOS: ${{ secrets.STORMLORD_VPS1_KNOWN_HOSTS }}
          HOST: ${{ secrets.STORMLORD_DEPLOY_HOST }}
        run: |
          [[ -n "$CHAVE" && -n "$CONHECIDOS" && -n "$HOST" ]]
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/stormlord
          printf '%s\n' "$CHAVE" > ~/.ssh/stormlord
          printf '%s\n' "$CONHECIDOS" > ~/.ssh/known_hosts

      - name: Publicar a versão aprovada
        if: inputs.publicar
        env:
          HOST: ${{ secrets.STORMLORD_DEPLOY_HOST }}
          SISTEMA: ${{ inputs.sistema }}
        run: |
          versao=$(git rev-parse HEAD)
          git archive --format=tar "$versao" |
            ssh -i ~/.ssh/stormlord -o IdentitiesOnly=yes "stormlord-deploy@$HOST" \
              "implantar $SISTEMA $versao"
